name: Build portfolio for GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure site address
        id: site
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          owner_name="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "${repository_name,,}" == "${owner_name}.github.io" ]]; then
            base_path=""
          else
            base_path="/${repository_name}"
          fi
          echo "base_path=${base_path}" >> "${GITHUB_OUTPUT}"
          echo "site_url=https://${owner_name}.github.io${base_path}" >> "${GITHUB_OUTPUT}"

      - name: Build static site
        run: pnpm run build:github
        env:
          PAGES_BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.site_url }}

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch out/.nojekyll
          git -C out init -b gh-pages
          git -C out config user.name "github-actions[bot]"
          git -C out config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C out add --all
          git -C out commit -m "Publish ${GITHUB_SHA}"
          git -C out remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C out push --force origin gh-pages
